name: Extract Quote JPGs (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only the two JPGs
        run: |
          mkdir -p /tmp/fl_extract app/src/main/res/drawable-nodpi
          unzip -o FocusLock-Android.zip "FocusLock-Android/app/src/main/res/drawable-nodpi/quote_best_version.jpg" "FocusLock-Android/app/src/main/res/drawable-nodpi/quote_adhan_success.jpg" -d /tmp/fl_extract
          cp /tmp/fl_extract/FocusLock-Android/app/src/main/res/drawable-nodpi/quote_best_version.jpg app/src/main/res/drawable-nodpi/
          cp /tmp/fl_extract/FocusLock-Android/app/src/main/res/drawable-nodpi/quote_adhan_success.jpg app/src/main/res/drawable-nodpi/
          test "$(stat -c%s app/src/main/res/drawable-nodpi/quote_best_version.jpg)" = "33915"
          test "$(stat -c%s app/src/main/res/drawable-nodpi/quote_adhan_success.jpg)" = "50381"
          ls -l app/src/main/res/drawable-nodpi/
      - name: Commit JPGs and remove temp files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f FocusLock-Android.zip .github/workflows/extract-jpgs.yml
          git add -A
          git commit -m "Add quote JPG resources (extracted from project archive)"
          git push
